name: CI

# Correctness gate for every push and pull request. Mirrors the sibling tldr
# project: formatting, lints, unit/integration tests, idempotency, then a
# browser smoke test of the built site.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Init config
        run: cargo run --locked -- init

      - name: Build
        run: cargo run --locked -- build

      - name: Idempotency
        run: cargo run --locked -- check-idempotent

  smoke:
    # Browser smoke test needs a real Chromium; run it after the fast checks.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Init config
        run: cargo run --locked -- init

      - name: Build the site
        run: cargo run --locked -- build

      - name: Install websocket-client
        run: python3 -m pip install --user websocket-client

      - name: Set up Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run smoke tests
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: python3 tests/smoke_test.py

  install-script:
    # Lint the release installer with shellcheck so it stays portable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shellcheck
        run: shellcheck scripts/install.sh scripts/build-release.sh
