name: CI

# Correctness gate for every push and pull request. Mirrors the sibling tldr
# project: formatting, lints, unit/integration tests, idempotency, then a
# browser smoke test of the built site.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Init config
        run: cargo run --locked -- init

      - name: Build
        run: cargo run --locked -- build

      - name: Idempotency
        run: cargo run --locked -- check-idempotent

  smoke:
    # Browser smoke test needs a real Chromium; run it after the fast checks.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Init config
        run: cargo run --locked -- init

      - name: Build the site
        run: cargo run --locked -- build

      - name: Install websocket-client
        run: python3 -m pip install --user websocket-client

      - name: Run smoke tests
        run: |
          # ubuntu-latest ships google-chrome; fall back to chromium if present.
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome/Chromium found on the runner" >&2
            exit 1
          fi
          python3 tests/smoke_test.py

  install-script:
    # Lint the release installer with shellcheck so it stays portable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck scripts/install.sh scripts/build-release.sh
