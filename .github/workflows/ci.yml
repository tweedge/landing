name: CI

# Correctness gate for every push and pull request. Mirrors the sibling tldr
# project: formatting, lints, unit/integration tests, idempotency, then a
# browser smoke test of the built site.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --locked

      - name: Idempotency
        run: cargo run --locked -- check-idempotent

  smoke:
    # Browser smoke test needs a real Chromium; run it after the fast checks.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the site
        run: cargo run --locked -- build

      - name: Install Chromium and websocket-client
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          python3 -m pip install --user websocket-client

      - name: Run smoke tests
        run: |
          # The harness honors CHROME_BIN; fall back to whichever name is installed.
          export CHROME_BIN="$(command -v chromium || command -v chromium-browser)"
          python3 tests/smoke_test.py

  install-script:
    # Lint the release installer with shellcheck so it stays portable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck scripts/install.sh scripts/build-release.sh
