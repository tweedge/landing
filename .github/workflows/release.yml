name: release

# Builds Linux binaries for the common architectures and publishes them as a
# GitHub release whenever a version tag is pushed. Versioning: stable releases
# are `x.y.z` (e.g. v1.0.0); suffixed tags publish as prereleases.
#
#   git tag v1.0.0 && git push origin v1.0.0            # stable
#   git tag v1.0.1-beta && git push origin v1.0.1-beta  # prerelease
#
# Also runnable via workflow_dispatch to build artifacts without publishing.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cross targets and toolchains
        run: |
          rustup target add \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            armv7-unknown-linux-gnueabihf \
            i686-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf gcc-i686-linux-gnu

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: bash scripts/build-release.sh

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -la dist/
          args=()
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*) args+=(--prerelease) ;;
          esac
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            -R "$REPO" \
            --title "$TAG" \
            --generate-notes \
            "${args[@]}"
