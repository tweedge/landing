[package]
name = "landing"
version = "2.0.0"
edition = "2021"
rust-version = "1.75"
description = "Local-first homelab start page: build, install, and serve"
license = "MIT"
repository = "https://github.com/tweedge/landing"
default-run = "landing"

[lib]
name = "landing"
path = "src/lib.rs"

[[bin]]
name = "landing"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
minijinja = "3"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "charset", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "1"
tiny_http = "0.12"
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
